<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Float"/>
<title>Float — Bills Account</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#0c0f14"/>
<meta name="mobile-web-app-capable" content="yes"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:        #0c0f14;
  --bg2:       #111520;
  --surface:   #161b26;
  --surface2:  #1c2233;
  --surface3:  #222a3d;
  --line:      rgba(255,255,255,0.06);
  --line2:     rgba(255,255,255,0.11);
  --text:      #e8eaf0;
  --text2:     #7a8099;
  --text3:     #454d63;
  --lime:      #c8f04a;
  --lime-dim:  rgba(200,240,74,0.12);
  --red:       #ff5f5f;
  --red-dim:   rgba(255,95,95,0.12);
  --amber:     #f5a623;
  --amber-dim: rgba(245,166,35,0.12);
  --blue:      #5b8def;
  --blue-dim:  rgba(91,141,239,0.12);
  --r:         16px;
  --r-sm:      10px;
  --mono:      'JetBrains Mono', monospace;
  --sans:      'Syne', sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

html,body{
  height:100%;
  font-family:var(--sans);
  background:var(--bg);
  color:var(--text);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

body{
  display:flex;
  flex-direction:column;
  max-width:480px;
  margin:0 auto;
  overflow-x:hidden;
}

body::before{
  content:'';
  position:fixed;
  top:-150px;
  left:50%;
  transform:translateX(-50%);
  width:500px;
  height:500px;
  background:radial-gradient(circle, rgba(200,240,74,0.055) 0%, transparent 68%);
  pointer-events:none;
  z-index:0;
}

/* HEADER */
.app-header{
  position:relative;z-index:1;
  padding:max(env(safe-area-inset-top),1rem) 1.25rem 0;
  display:flex;align-items:center;justify-content:space-between;
}
.app-name{font-size:26px;font-weight:700;letter-spacing:-0.05em;color:var(--text);line-height:1;}
.app-name em{color:var(--lime);font-style:normal;}
.app-tagline{font-size:9px;font-weight:400;color:var(--text3);letter-spacing:.14em;text-transform:uppercase;font-family:var(--mono);margin-top:4px;}
.settings-btn{
  width:38px;height:38px;border-radius:50%;
  border:1px solid var(--line2);background:var(--surface);
  color:var(--text2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:16px;
  transition:all .2s;flex-shrink:0;
}
.settings-btn:hover{border-color:var(--lime);color:var(--lime);}

/* PAY STRIP */
.pay-strip{
  position:relative;z-index:1;
  margin:1.25rem 1.25rem 0;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 18px;display:flex;
}
.pay-cell{flex:1;display:flex;flex-direction:column;gap:3px;}
.pay-cell+.pay-cell{border-left:1px solid var(--line);padding-left:18px;margin-left:18px;}
.pcl{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);font-family:var(--mono);}
.pcv{font-size:13px;font-weight:600;color:var(--text);letter-spacing:-0.01em;}
.pcv.lime{color:var(--lime);}

/* HERO */
.hero{
  position:relative;z-index:1;
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
  margin:10px 1.25rem 0;
}
.hero-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:18px 16px;position:relative;overflow:hidden;
}
.hero-card.primary{background:var(--lime);border-color:var(--lime);}
.hero-card.primary::after{
  content:'';position:absolute;inset:0;border-radius:var(--r);
  background:linear-gradient(135deg,rgba(255,255,255,.18) 0%,transparent 55%);
  pointer-events:none;
}
.hl{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);font-family:var(--mono);margin-bottom:10px;}
.hero-card.primary .hl{color:rgba(0,0,0,.45);}
.hv{font-size:24px;font-weight:400;letter-spacing:-0.05em;color:var(--text);font-family:var(--mono);line-height:1;}
.hero-card.primary .hv{color:#0c0f14;}
.hs{font-size:10px;color:var(--text3);margin-top:6px;font-family:var(--mono);}
.hero-card.primary .hs{color:rgba(0,0,0,.4);}

/* DATE CHECKER */
.date-checker{
  position:relative;z-index:1;
  margin:10px 1.25rem 0;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 18px;display:flex;align-items:center;gap:12px;
  transition:border-color .2s;
}
.date-checker:focus-within{border-color:var(--line2);}
.dc-left{flex:1;min-width:0;}
.dc-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);font-family:var(--mono);margin-bottom:4px;}
.date-checker input[type=date]{
  font-size:14px;font-weight:600;font-family:var(--sans);
  border:none;background:transparent;color:var(--text);outline:none;width:100%;letter-spacing:-0.01em;
}
.dc-right{text-align:right;flex-shrink:0;}
.dc-val{font-size:20px;font-weight:400;font-family:var(--mono);color:var(--lime);letter-spacing:-0.05em;line-height:1;}
.dc-sub{font-size:9px;color:var(--text3);font-family:var(--mono);margin-top:4px;text-transform:uppercase;letter-spacing:.07em;}

/* TABS */
.tabs{
  position:relative;z-index:1;
  display:flex;margin:1.25rem 1.25rem 0;
  border-bottom:1px solid var(--line);
}
.tab{
  flex:1;text-align:center;font-size:11px;font-weight:700;
  padding:10px 4px;cursor:pointer;color:var(--text3);
  border:none;background:none;font-family:var(--sans);
  letter-spacing:.06em;text-transform:uppercase;
  position:relative;transition:color .2s;
}
.tab::after{
  content:'';position:absolute;bottom:-1px;left:0;right:0;
  height:2px;background:var(--lime);border-radius:2px 2px 0 0;
  opacity:0;transition:opacity .2s;
}
.tab.active{color:var(--lime);}
.tab.active::after{opacity:1;}

/* CONTENT */
.content{
  position:relative;z-index:1;
  flex:1;overflow-y:auto;padding:0 1.25rem 6rem;
}
.content::-webkit-scrollbar{width:0;}

.section-hd{
  font-size:9px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--text3);font-family:var(--mono);
  margin:1.25rem 0 10px;display:flex;justify-content:space-between;align-items:center;
}
.add-btn{
  font-size:11px;font-weight:700;padding:5px 14px;
  border:1px solid var(--line2);border-radius:999px;
  background:transparent;color:var(--text2);cursor:pointer;font-family:var(--sans);
  letter-spacing:.04em;transition:all .2s;
}
.add-btn:hover{border-color:var(--lime);color:var(--lime);}

/* BILL CARDS */
.bill-list{display:flex;flex-direction:column;gap:6px;margin-bottom:1rem;}

.bill-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 16px;cursor:pointer;
  transition:border-color .15s,background .15s;
  animation:fadeUp .3s ease both;
}
.bill-card:hover{border-color:var(--line2);background:var(--surface2);}
.bill-card.overdue{border-left:2px solid var(--red);}
.bill-card.soon{border-left:2px solid var(--amber);}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.bill-list .bill-card:nth-child(1){animation-delay:.02s;}
.bill-list .bill-card:nth-child(2){animation-delay:.05s;}
.bill-list .bill-card:nth-child(3){animation-delay:.08s;}
.bill-list .bill-card:nth-child(4){animation-delay:.11s;}
.bill-list .bill-card:nth-child(5){animation-delay:.14s;}
.bill-list .bill-card:nth-child(6){animation-delay:.17s;}
.bill-list .bill-card:nth-child(7){animation-delay:.20s;}
.bill-list .bill-card:nth-child(8){animation-delay:.23s;}
.bill-list .bill-card:nth-child(n+9){animation-delay:.26s;}

.bill-row-main{display:flex;align-items:center;gap:12px;}
.bill-icon-wrap{
  width:36px;height:36px;border-radius:10px;
  background:var(--surface3);display:flex;align-items:center;
  justify-content:center;font-size:16px;flex-shrink:0;
}
.bill-body{flex:1;min-width:0;}
.bill-name{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-0.02em;}
.bill-meta{font-size:10px;color:var(--text3);margin-top:2px;font-family:var(--mono);}
.bill-right{text-align:right;flex-shrink:0;}
.bill-fn{font-size:15px;font-weight:400;font-family:var(--mono);color:var(--text);letter-spacing:-0.03em;}
.bill-fn-lbl{font-size:9px;color:var(--text3);font-family:var(--mono);margin-top:2px;text-transform:uppercase;letter-spacing:.05em;}

.bill-actions{
  display:flex;gap:8px;margin-top:12px;padding-top:12px;
  border-top:1px solid var(--line);align-items:center;
}
.bill-actions button{
  font-size:11px;font-weight:700;padding:5px 14px;
  border:1px solid var(--line2);border-radius:999px;
  background:transparent;color:var(--text2);cursor:pointer;font-family:var(--sans);
  transition:all .15s;
}
.bill-actions button:hover{color:var(--text);background:var(--surface3);}
.bill-actions .del-btn{color:var(--red);border-color:transparent;margin-left:auto;}
.bill-actions .del-btn:hover{background:var(--red-dim);border-color:transparent;}
.bill-note-inline{flex:1;font-size:10px;color:var(--text3);font-style:italic;font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* TOTAL BAR */
.total-bar{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:14px 18px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);margin-bottom:2rem;
}
.total-bar-label{font-size:10px;color:var(--text3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.07em;}
.total-bar-val{font-size:18px;font-weight:400;font-family:var(--mono);color:var(--lime);letter-spacing:-0.04em;}

/* SCHEDULE */
.period-hd{
  font-size:9px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--text3);font-family:var(--mono);
  margin:1.25rem 0 8px;padding-bottom:8px;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;
}
.period-bal{color:var(--lime);}

.sched-row{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 16px;display:flex;align-items:center;gap:12px;margin-bottom:6px;
  transition:border-color .15s;
}
.sched-row:hover{border-color:var(--line2);}
.sched-row.overdue{border-left:2px solid var(--red);}
.sched-row.soon{border-left:2px solid var(--amber);}
.sched-icon{width:32px;height:32px;border-radius:9px;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.sched-body{flex:1;min-width:0;}
.sched-name{font-size:13px;font-weight:700;color:var(--text);letter-spacing:-0.02em;}
.sched-type{font-size:10px;color:var(--text3);font-family:var(--mono);margin-top:1px;}
.sched-date-col{text-align:right;flex-shrink:0;}
.sched-date{font-size:12px;font-weight:500;color:var(--text);font-family:var(--mono);}
.sched-days{font-size:10px;font-family:var(--mono);margin-top:2px;}
.sched-amt{text-align:right;flex-shrink:0;min-width:64px;font-family:var(--mono);font-size:13px;color:var(--text);letter-spacing:-0.02em;}

/* BADGE */
.badge{font-size:9px;padding:2px 7px;border-radius:999px;font-weight:600;display:inline-block;font-family:var(--mono);letter-spacing:.04em;text-transform:uppercase;}
.badge-auto{background:var(--blue-dim);color:var(--blue);}
.badge-bpay{background:var(--amber-dim);color:var(--amber);}
.badge-transfer{background:var(--lime-dim);color:var(--lime);}

/* MODAL */
.modal-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.75);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  z-index:200;align-items:flex-end;justify-content:center;
}
.modal-overlay.open{display:flex;}
@media(min-width:480px){.modal-overlay{align-items:center;}}

.modal{
  background:var(--surface);border:1px solid var(--line2);
  border-radius:var(--r) var(--r) 0 0;
  padding:1.5rem 1.25rem;
  padding-bottom:max(1.5rem,env(safe-area-inset-bottom));
  width:100%;max-width:480px;max-height:92vh;overflow-y:auto;
}
@media(min-width:480px){.modal{border-radius:var(--r);}}

.modal-handle{width:32px;height:3px;background:var(--line2);border-radius:2px;margin:0 auto 1.5rem;}
.modal-title{font-size:22px;font-weight:700;letter-spacing:-0.04em;margin-bottom:1.25rem;color:var(--text);}

.form-field{margin-bottom:14px;}
.form-field label{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);display:block;margin-bottom:6px;font-family:var(--mono);}
.form-field input,.form-field select{
  width:100%;font-size:15px;font-weight:600;font-family:var(--sans);
  padding:12px 14px;border:1px solid var(--line2);border-radius:var(--r-sm);
  background:var(--surface2);color:var(--text);outline:none;
  appearance:none;-webkit-appearance:none;letter-spacing:-0.01em;transition:border-color .15s;
}
.form-field input:focus,.form-field select:focus{border-color:var(--lime);}
.form-field input::placeholder{color:var(--text3);}
.form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.modal-actions{display:flex;gap:10px;margin-top:1.5rem;}
.modal-actions button{
  flex:1;padding:14px;border-radius:var(--r-sm);
  font-size:14px;font-family:var(--sans);font-weight:700;
  cursor:pointer;letter-spacing:-0.01em;transition:all .15s;
}
.btn-cancel{background:var(--surface2);border:1px solid var(--line2);color:var(--text2);}
.btn-cancel:hover{color:var(--text);}
.btn-save{background:var(--lime);border:1px solid var(--lime);color:#0c0f14;}
.btn-save:hover{opacity:.88;}
.reset-btn{
  width:100%;padding:12px;border-radius:var(--r-sm);
  font-size:13px;font-family:var(--sans);font-weight:700;cursor:pointer;
  background:var(--red-dim);color:var(--red);border:1px solid rgba(255,95,95,.2);
  margin-top:1rem;letter-spacing:-0.01em;transition:all .15s;
}
.reset-btn:hover{background:rgba(255,95,95,.2);}

.empty{text-align:center;padding:3rem 1rem;color:var(--text3);font-size:12px;font-family:var(--mono);}
.safe-bottom{height:env(safe-area-inset-bottom,0);}
</style>
</head>
<body>

<div class="app-header">
  <div>
    <div class="app-name">Flo<em>a</em>t</div>
    <div class="app-tagline">Bills Account</div>
  </div>
  <button class="settings-btn" onclick="openSettings()">⚙</button>
</div>

<div class="pay-strip">
  <div class="pay-cell">
    <div class="pcl">Last pay</div>
    <div class="pcv" id="lastPayVal">—</div>
  </div>
  <div class="pay-cell">
    <div class="pcl">Next pay</div>
    <div class="pcv lime" id="nextPayVal">—</div>
  </div>
  <div class="pay-cell">
    <div class="pcl">Days away</div>
    <div class="pcv" id="daysAwayVal">—</div>
  </div>
</div>

<div class="hero">
  <div class="hero-card primary">
    <div class="hl">Transfer each pay</div>
    <div class="hv" id="heroContrib">$0</div>
    <div class="hs">into bills account</div>
  </div>
  <div class="hero-card">
    <div class="hl">Should be in account</div>
    <div class="hv" id="heroToday">$0</div>
    <div class="hs">as of today</div>
  </div>
</div>

<div class="date-checker">
  <div class="dc-left">
    <div class="dc-lbl">Check balance on</div>
    <input type="date" id="checkDate" oninput="render()"/>
  </div>
  <div class="dc-right">
    <div class="dc-val" id="dateCheckVal">$0</div>
    <div class="dc-sub" id="dateCheckLbl">needed</div>
  </div>
</div>

<div class="tabs">
  <button class="tab active" onclick="setTab('breakdown')">Breakdown</button>
  <button class="tab" onclick="setTab('schedule')">Schedule</button>
</div>

<div class="content">
  <div id="tabBreakdown">
    <div class="section-hd">
      <span>Bills &amp; contributions</span>
      <button class="add-btn" onclick="openModal(null)">+ Add</button>
    </div>
    <div class="bill-list" id="billList"></div>
    <div class="total-bar">
      <span class="total-bar-label">Transfer every pay day</span>
      <span class="total-bar-val" id="totalVal">$0</span>
    </div>
  </div>
  <div id="tabSchedule" style="display:none;">
    <div id="scheduleList"></div>
  </div>
</div>

<!-- Bill modal -->
<div class="modal-overlay" id="billModal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalTitle">Add bill</div>
    <div class="form-field">
      <label>Bill name</label>
      <input type="text" id="fName" placeholder="e.g. Electricity" autocomplete="off"/>
    </div>
    <div class="form-row-2">
      <div class="form-field">
        <label>Amount ($)</label>
        <input type="number" id="fAmount" placeholder="0.00" step="0.01" min="0" inputmode="decimal"/>
      </div>
      <div class="form-field">
        <label>Frequency</label>
        <select id="fFreq">
          <option>Weekly</option><option>Fortnightly</option>
          <option selected>Monthly</option><option>Quarterly</option>
          <option>BiAnnual</option><option>Annual</option>
        </select>
      </div>
    </div>
    <div class="form-row-2">
      <div class="form-field">
        <label>Payment type</label>
        <select id="fType"><option>Auto</option><option>BPAY</option><option>Transfer</option></select>
      </div>
      <div class="form-field">
        <label>Category</label>
        <select id="fCat">
          <option>Home</option><option>Car</option><option>Insurance</option>
          <option>Utilities</option><option>Subscriptions</option>
          <option>Family</option><option>Finance</option><option>Other</option>
        </select>
      </div>
    </div>
    <div class="form-field">
      <label>Last paid date</label>
      <input type="date" id="fLastPaid"/>
    </div>
    <div class="form-field">
      <label>Note (optional)</label>
      <input type="text" id="fNote" placeholder="Any notes..." autocomplete="off"/>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveBill()">Save</button>
    </div>
  </div>
</div>

<!-- Settings modal -->
<div class="modal-overlay" id="settingsModal" onclick="if(event.target===this)closeSettings()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Pay cycle</div>
    <div class="form-field">
      <label>Last pay date</label>
      <input type="date" id="sLastPay"/>
    </div>
    <div class="form-field">
      <label>Pay frequency</label>
      <select id="sFreq">
        <option value="14" selected>Fortnightly</option>
        <option value="7">Weekly</option>
        <option value="28">Four-weekly</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeSettings()">Cancel</button>
      <button class="btn-save" onclick="saveSettings()">Save</button>
    </div>
    <button class="reset-btn" onclick="resetAll()">Reset all data to defaults</button>
  </div>
</div>

<div class="safe-bottom"></div>

<script>
const ICONS={Home:'🏠',Car:'🚗',Insurance:'🛡️',Utilities:'⚡',Subscriptions:'📱',Family:'👨‍👩‍👧',Finance:'🏦',Other:'📋'};
const FREQ_DAYS={Weekly:7,Fortnightly:14,Monthly:30.4375,Quarterly:91.3125,BiAnnual:182.625,Annual:365.25};

const DEFAULT_BILLS=[
  {id:1,name:'Mortgage',amount:625,freq:'Weekly',type:'Transfer',cat:'Finance',lastPaid:'2026-04-30',note:'Macquarie Bank — every Thursday'},
  {id:2,name:'House Insurance',amount:184,freq:'Monthly',type:'BPAY',cat:'Insurance',lastPaid:'2026-04-21',note:'RACT — 21st of month'},
  {id:3,name:'Water Rates',amount:400,freq:'Quarterly',type:'BPAY',cat:'Home',lastPaid:'2026-04-14',note:'TASWater — 14th of month'},
  {id:4,name:'Council Rates',amount:600,freq:'Quarterly',type:'BPAY',cat:'Home',lastPaid:'2026-05-01',note:'Paid quarterly Aug, Nov, Feb, May — 2025/26 total $2,302'},
  {id:5,name:'Electricity',amount:300,freq:'Monthly',type:'BPAY',cat:'Utilities',lastPaid:'2026-04-24',note:'Energy Locals — govt rebate + solar, ~$30 otherwise'},
  {id:6,name:'Jimbo Phone',amount:59,freq:'Monthly',type:'Transfer',cat:'Subscriptions',lastPaid:'2026-04-28',note:'Aldi Mobile — 28th of month'},
  {id:7,name:'Anjie Phone',amount:25,freq:'Monthly',type:'BPAY',cat:'Subscriptions',lastPaid:'2026-04-10',note:'Woolworths Mobile — comes from Spendings'},
  {id:8,name:'Spotify',amount:28,freq:'Monthly',type:'Transfer',cat:'Subscriptions',lastPaid:'2026-04-28',note:'28th of month'},
  {id:9,name:'Strava',amount:20,freq:'Monthly',type:'Transfer',cat:'Subscriptions',lastPaid:'2026-04-14',note:'14th of month'},
  {id:10,name:'Kayo',amount:30,freq:'Monthly',type:'Auto',cat:'Subscriptions',lastPaid:'2026-04-03',note:'Hubbl — 3rd of month'},
  {id:11,name:'Child Care',amount:70,freq:'Fortnightly',type:'BPAY',cat:'Family',lastPaid:'2026-04-30',note:'Newstead Child Care — every 2nd Thursday'},
  {id:12,name:'Car Insurance (Ford)',amount:265,freq:'Annual',type:'Transfer',cat:'Insurance',lastPaid:'2026-03-22',note:'AAMI — 22nd March annually'},
  {id:13,name:'Car Insurance (Outlander)',amount:94,freq:'Monthly',type:'BPAY',cat:'Insurance',lastPaid:'2026-04-20',note:'RACT — look to change provider, used to be $59'},
  {id:14,name:'Car Rego (Ford)',amount:330,freq:'BiAnnual',type:'Transfer',cat:'Car',lastPaid:'2026-03-19',note:'Service TAS — due 21st September'},
  {id:15,name:'Car Rego (Outlander)',amount:348,freq:'BiAnnual',type:'Transfer',cat:'Car',lastPaid:'2026-04-18',note:'Service TAS — due 18th October'},
];
const DEFAULT_SETTINGS={lastPay:'2026-04-28',payCycleDays:14};
const DATA_VERSION=5;

function load(){
  try{
    const v=parseInt(localStorage.getItem('bills_version')||'0');
    if(v<DATA_VERSION){
      localStorage.removeItem('bills_data');
      localStorage.removeItem('bills_settings');
      localStorage.setItem('bills_version',DATA_VERSION);
    }
    const b=localStorage.getItem('bills_data');
    const s=localStorage.getItem('bills_settings');
    return{bills:b?JSON.parse(b):JSON.parse(JSON.stringify(DEFAULT_BILLS)),settings:s?JSON.parse(s):{...DEFAULT_SETTINGS}};
  }catch(e){return{bills:JSON.parse(JSON.stringify(DEFAULT_BILLS)),settings:{...DEFAULT_SETTINGS}};}
}
function save(){
  localStorage.setItem('bills_data',JSON.stringify(state.bills));
  localStorage.setItem('bills_settings',JSON.stringify(state.settings));
}

let state=load();
let nextId=state.bills.reduce((m,b)=>Math.max(m,b.id),0)+1;
let editingId=null;
let currentTab='breakdown';
let expandedId=null;

function parseDate(s){if(!s)return null;const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function localDateStr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function todayStr(){return localDateStr(new Date());}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function daysBetween(a,b){return Math.round((parseDate(b)-parseDate(a))/86400000);}
function toFN(amount,freq){return amount/FREQ_DAYS[freq]*14;}
function fmt(n){return'$'+Math.round(n).toLocaleString('en-AU');}
function fmt2(n){return'$'+(Math.round(n*100)/100).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtDate(s){if(!s)return'—';return parseDate(s).toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});}
function fmtDateShort(s){if(!s)return'—';return parseDate(s).toLocaleDateString('en-AU',{day:'numeric',month:'short'});}

function nextPayDate(){
  const today=new Date();today.setHours(0,0,0,0);
  let d=parseDate(state.settings.lastPay);
  const cycle=parseInt(state.settings.payCycleDays);
  while(d<=today)d=addDays(d,cycle);
  return d;
}

function getNextDue(bill,fromStr){
  if(!bill.lastPaid)return null;
  const from=parseDate(fromStr);
  const cycle=Math.round(FREQ_DAYS[bill.freq]);
  const d=parseDate(bill.lastPaid);
  while(d<=from)d.setDate(d.getDate()+cycle);
  return localDateStr(d);
}

function requiredBalance(bill,checkDate){
  if(!bill.lastPaid||bill.amount===0)return 0;
  const nd=getNextDue(bill,checkDate);
  if(!nd)return 0;
  const daysUntil=daysBetween(checkDate,nd);
  const cycle=FREQ_DAYS[bill.freq];
  return bill.amount*Math.max(0,Math.min(1,1-daysUntil/cycle));
}

function billsDueBetween(bill,fromStr,toStr){
  if(!bill.lastPaid||bill.amount===0)return 0;
  const from=parseDate(fromStr);
  const to=parseDate(toStr);
  let total=0;
  const cycle=Math.round(FREQ_DAYS[bill.freq]);
  const d=parseDate(bill.lastPaid);
  d.setDate(d.getDate()+cycle);
  while(d<=to){if(d>from)total+=bill.amount;d.setDate(d.getDate()+cycle);}
  return total;
}

function accountBalance(checkDate){
  const lastPayStr=state.settings.lastPay;
  const totalRequired=state.bills.reduce((s,b)=>s+requiredBalance(b,checkDate),0);
  const fnContrib=state.bills.reduce((s,b)=>s+toFN(b.amount,b.freq),0);
  const billsOut=state.bills.reduce((s,b)=>s+billsDueBetween(b,lastPayStr,checkDate),0);
  return totalRequired+fnContrib-billsOut;
}

function dueDatesInRange(bill,fromStr,toStr){
  if(!bill.lastPaid)return[];
  const from=parseDate(fromStr);const to=parseDate(toStr);
  const cycle=Math.round(FREQ_DAYS[bill.freq]);
  const d=parseDate(bill.lastPaid);
  d.setDate(d.getDate()+cycle);
  const results=[];
  while(d<=to){if(d>=from)results.push(localDateStr(d));d.setDate(d.getDate()+cycle);}
  return results;
}

function setTab(t){
  currentTab=t;
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',['breakdown','schedule'][i]===t));
  document.getElementById('tabBreakdown').style.display=t==='breakdown'?'':'none';
  document.getElementById('tabSchedule').style.display=t==='schedule'?'':'none';
}

function openModal(id){
  editingId=id;
  const b=id?state.bills.find(x=>x.id===id):null;
  document.getElementById('modalTitle').textContent=id?'Edit bill':'Add bill';
  document.getElementById('fName').value=b?b.name:'';
  document.getElementById('fAmount').value=b?b.amount:'';
  document.getElementById('fFreq').value=b?b.freq:'Monthly';
  document.getElementById('fType').value=b?b.type:'Auto';
  document.getElementById('fCat').value=b?b.cat:'Home';
  document.getElementById('fLastPaid').value=b?b.lastPaid:'';
  document.getElementById('fNote').value=b?b.note:'';
  document.getElementById('billModal').classList.add('open');
  setTimeout(()=>document.getElementById('fName').focus(),100);
}
function closeModal(){document.getElementById('billModal').classList.remove('open');}
function saveBill(){
  const name=document.getElementById('fName').value.trim();
  if(!name)return;
  const b={
    id:editingId||nextId++,name,
    amount:parseFloat(document.getElementById('fAmount').value)||0,
    freq:document.getElementById('fFreq').value,
    type:document.getElementById('fType').value,
    cat:document.getElementById('fCat').value,
    lastPaid:document.getElementById('fLastPaid').value,
    note:document.getElementById('fNote').value.trim(),
  };
  if(editingId)state.bills=state.bills.map(x=>x.id===editingId?b:x);
  else state.bills.push(b);
  save();closeModal();render();
}
function deleteBill(id){
  if(confirm('Remove this bill?')){state.bills=state.bills.filter(b=>b.id!==id);expandedId=null;save();render();}
}
function toggleExpand(id){expandedId=expandedId===id?null:id;render();}

function openSettings(){
  document.getElementById('sLastPay').value=state.settings.lastPay;
  document.getElementById('sFreq').value=state.settings.payCycleDays;
  document.getElementById('settingsModal').classList.add('open');
}
function closeSettings(){document.getElementById('settingsModal').classList.remove('open');}
function saveSettings(){
  state.settings.lastPay=document.getElementById('sLastPay').value;
  state.settings.payCycleDays=parseInt(document.getElementById('sFreq').value);
  save();closeSettings();render();
}
function resetAll(){
  if(confirm('Reset all bills and settings to defaults?')){
    localStorage.clear();state=load();
    nextId=state.bills.reduce((m,b)=>Math.max(m,b.id),0)+1;
    closeSettings();render();
  }
}

function render(){
  const today=todayStr();
  const checkDate=document.getElementById('checkDate').value||today;
  const nextPay=nextPayDate();
  const nextPayStr=localDateStr(nextPay);
  const daysToNext=daysBetween(today,nextPayStr);

  document.getElementById('lastPayVal').textContent=fmtDate(state.settings.lastPay);
  document.getElementById('nextPayVal').textContent=fmtDate(nextPayStr);
  document.getElementById('daysAwayVal').textContent=daysToNext===0?'today':daysToNext+'d';

  const totalFN=state.bills.reduce((s,b)=>s+toFN(b.amount,b.freq),0);
  document.getElementById('heroContrib').textContent=fmt2(totalFN);
  document.getElementById('totalVal').textContent=fmt2(totalFN);
  document.getElementById('heroToday').textContent=fmt(accountBalance(today));

  const dateBal=accountBalance(checkDate);
  document.getElementById('dateCheckVal').textContent=fmt(dateBal);
  document.getElementById('dateCheckLbl').textContent=checkDate===nextPayStr?'on pay day':'should be in account';

  // Breakdown
  const sorted=[...state.bills].sort((a,b)=>toFN(b.amount,b.freq)-toFN(a.amount,a.freq));
  document.getElementById('billList').innerHTML=sorted.map(b=>{
    const fn=toFN(b.amount,b.freq);
    const nd=b.lastPaid?getNextDue(b,today):null;
    const daysLeft=nd?daysBetween(today,nd):null;
    const isOverdue=daysLeft!==null&&daysLeft<0;
    const isSoon=daysLeft!==null&&daysLeft>=0&&daysLeft<=7;
    const isExpanded=expandedId===b.id;
    let dueStr='';
    if(daysLeft!==null){
      if(isOverdue)dueStr=`<span style="color:var(--red)">overdue ${Math.abs(daysLeft)}d</span>`;
      else if(daysLeft===0)dueStr=`<span style="color:var(--amber)">due today</span>`;
      else if(isSoon)dueStr=`<span style="color:var(--amber)">in ${daysLeft}d</span>`;
      else dueStr=`in ${daysLeft}d`;
    }
    const typeBadge=`<span class="badge badge-${b.type.toLowerCase()}">${b.type}</span>`;
    const actionsHtml=isExpanded?`<div class="bill-actions">
      <button onclick="openModal(${b.id});event.stopPropagation()">Edit</button>
      ${b.note?`<span class="bill-note-inline">${b.note}</span>`:''}
      <button class="del-btn" onclick="deleteBill(${b.id});event.stopPropagation()">Remove</button>
    </div>`:'';
    return `<div class="bill-card${isOverdue?' overdue':isSoon?' soon':''}" onclick="toggleExpand(${b.id})">
      <div class="bill-row-main">
        <div class="bill-icon-wrap">${ICONS[b.cat]||'📋'}</div>
        <div class="bill-body">
          <div class="bill-name">${b.name}</div>
          <div class="bill-meta">${b.freq.toLowerCase()} · ${typeBadge}${dueStr?' · '+dueStr:''}</div>
        </div>
        <div class="bill-right">
          <div class="bill-fn">${fmt2(fn)}</div>
          <div class="bill-fn-lbl">/ fortnight</div>
        </div>
      </div>
      ${actionsHtml}
    </div>`;
  }).join('');

  // Schedule
  const rangeEnd=localDateStr(addDays(parseDate(today),90));
  const allPayments=[];
  state.bills.forEach(b=>{dueDatesInRange(b,today,rangeEnd).forEach(date=>allPayments.push({date,bill:b}));});
  allPayments.sort((a,b)=>a.date.localeCompare(b.date));

  const cycle=parseInt(state.settings.payCycleDays);
  let html='';let lastPeriod='';
  allPayments.forEach(({date,bill:b})=>{
    const daysLeft=daysBetween(today,date);
    const isOverdue=daysLeft<0;const isSoon=daysLeft>=0&&daysLeft<=7;
    let d=parseDate(state.settings.lastPay);let pNum=0;
    const dateD=parseDate(date);
    while(addDays(d,cycle)<=dateD){d=addDays(d,cycle);pNum++;}
    const pStart=localDateStr(d);const pEnd=localDateStr(addDays(d,cycle-1));
    const pLabel=pNum===0?`This period · ${fmtDateShort(pStart)}–${fmtDateShort(pEnd)}`:
                 pNum===1?`Next period · ${fmtDateShort(pStart)}–${fmtDateShort(pEnd)}`:
                 `${fmtDateShort(pStart)}–${fmtDateShort(pEnd)}`;
    if(pLabel!==lastPeriod){
      html+=`<div class="period-hd"><span>${pLabel}</span><span class="period-bal">${fmt(accountBalance(pStart))}</span></div>`;
      lastPeriod=pLabel;
    }
    const daysColor=isOverdue?'var(--red)':isSoon?'var(--amber)':'var(--text3)';
    const daysText=isOverdue?`-${Math.abs(daysLeft)}d`:daysLeft===0?'today':`+${daysLeft}d`;
    html+=`<div class="sched-row${isOverdue?' overdue':isSoon?' soon':''}">
      <div class="sched-icon">${ICONS[b.cat]||'📋'}</div>
      <div class="sched-body">
        <div class="sched-name">${b.name}</div>
        <div class="sched-type">${b.type.toLowerCase()}</div>
      </div>
      <div class="sched-date-col">
        <div class="sched-date">${fmtDateShort(date)}</div>
        <div class="sched-days" style="color:${daysColor}">${daysText}</div>
      </div>
      <div class="sched-amt">${fmt2(b.amount)}</div>
    </div>`;
  });
  document.getElementById('scheduleList').innerHTML=html||'<div class="empty">no upcoming bills in next 90 days</div>';
}

document.getElementById('checkDate').value=localDateStr(nextPayDate());
render();
</script>
